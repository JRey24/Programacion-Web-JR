<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="style.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta Medios de Transporte</title>
</head>
<body>
    <main class="card">
        <h1>🚗🚕Encuesta Medios de Transporte🚗🚕</h1>
        <p class="subtitulo">Ingresa tus datos para la encuesta de medios de transporte🚗</p>

        <form id="encuesta">
            <div class="campo nombre-apellido">
                <label for="nombre">👤 Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü ]+" title="Solo letras y espacios.">
            </div>

            <div class="campo nombre-apellido">
                <label for="apellido">👤Apellido</label>
                <input type="text" id="apellido" name="apellido" placeholder="Escribe tu apellido" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü ]+" title="Solo letras y espacios.">
            </div>
            <div class="campo">
                <label for="direccion">🏠 Dirección</label>
                <input type="text" id="direccion" name="direccion" placeholder="Ej: Cra 123 #45-67" required>
            </div>
            
            <div class="campo">
                <label for="genero">⚧ Género</label>
                <select id="genero" name="genero" required>
                    <option value="">Selecciona tu género</option>
                    <option value="masculino">Masculino</option>
                    <option value="femenino">Femenino</option>
                    <option value="otro">Otro</option>
                </select>
            </div>

            <div class="campo">
                <label for="edad">🎂 Edad</label>
                <input type="number" id="edad" name="edad" placeholder="Ej: 20">
            </div>

            <div class="campo">
                <label for="telefono">📞 Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej: 3001234567" pattern="[0-9]{10}" title="Ingresa un número de teléfono válido de 10 dígitos">
            </div>

            <div class="campo">
                <label for="correo">✉️ Correo Electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="Ej: juan.perez@ejemplo.com" required>
            </div>

            <div class="campo">
                <label for="profesionOficio">💼 Profesión u Oficio</label>
                <input type="text" id="profesionOficio" name="profesionOficio" placeholder="Ej: Ingeniero de Software" required>
            </div>

            <button type="submit" class="btn-enviar">📨 Enviar Encuesta</button>
        </form>
    </main>
    <script src="app.js"></script>
</body>
</html>
